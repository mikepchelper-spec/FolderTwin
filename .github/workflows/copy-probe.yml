name: Copy probe

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Verify synthetic copy and restore
        run: dotnet run --project experiments/CopyProbe --configuration Release
      - name: Compare Windows transports
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --compare
      - name: Compare buffered and unbuffered verification
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --uncached
      - name: Verify directory rename and junction behavior
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --paths
      - name: Verify read-only inspection and reopening of product roots
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --product-roots
      - name: Verify durable product job registration
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --product-jobs
      - name: Verify reviewed portable configuration and restoration of imported jobs
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --product-config
      - name: Verify product versions, mirror, offline restoration and retention
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --product-store
      - name: Verify cumulative updates, destination conflicts and interrupted publication
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --accumulative
      - name: Verify persistent product workers, pause, cancellation and process termination
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --product-runs
      - name: Verify reviewed restoration workers, cancellation, interruption and route exclusion
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --product-restore
      - name: Verify bounded metadata inventory and partial results
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --inventory
      - name: Verify synthetic batches, partial results, and retry
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --batch
      - name: Verify configurable disposable workspaces
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --workspace
      - name: Verify versioned snapshots and restoration from shared objects
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --versions
      - name: Verify replicated generation expectations and interrupted registry writes
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --registry
      - name: Verify retention, recoverable quarantine and deferred purge
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --retention
      - name: Verify protected mirror previews, interruptions and recovery
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --mirror
      - name: Measure retention across eight generations with an absent source
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --retention-scale
      - name: Verify persistent headless version jobs
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --jobs
      - name: Verify versioning above the initial catalog entry limit
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --version-scale 10240 32
      - name: Verify confirmed catalogs and independent restoration
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --catalog
      - name: Verify durable pending intent and worker termination recovery
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --resume
      - name: Build the portable app twice and verify the WPF flow from the package
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'FolderTwin-source.tar'
          $sourceA = Join-Path $env:RUNNER_TEMP 'FolderTwin-source-A'
          $sourceB = Join-Path $env:RUNNER_TEMP 'FolderTwin-source-B'
          $outputA = Join-Path $env:RUNNER_TEMP 'FolderTwin-alpha-win-x64'
          $outputB = Join-Path $env:RUNNER_TEMP 'FolderTwin-reproduction'
          git archive --format=tar "--output=$archive" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the tested commit.' }
          foreach ($source in @($sourceA, $sourceB)) {
            New-Item -ItemType Directory -Path $source | Out-Null
            tar -xf $archive -C $source
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract a clean source tree.' }
          }
          & (Join-Path $sourceA 'scripts/Publish-Alpha.ps1') -OutputDirectory $outputA -SourceArchive $archive
          & (Join-Path $sourceB 'scripts/Publish-Alpha.ps1') -OutputDirectory $outputB -SourceArchive $archive
          $first = Get-FileHash -LiteralPath (Join-Path $outputA 'SHA256SUMS.txt')
          $second = Get-FileHash -LiteralPath (Join-Path $outputB 'SHA256SUMS.txt')
          if ($first.Hash -ne $second.Hash) {
            Compare-Object (Get-Content $first.Path) (Get-Content $second.Path)
            throw 'Independent builds produced different file hashes.'
          }
          Write-Host "Matching portable distributions. SHA256SUMS.txt SHA-256 $($first.Hash)"
          $runtime = Get-Content -LiteralPath (Join-Path $outputA 'CopyLab.runtimeconfig.json') -Raw | ConvertFrom-Json
          $frameworks = $runtime.runtimeOptions.includedFrameworks.name
          if ($frameworks -notcontains 'Microsoft.NETCore.App' -or $frameworks -notcontains 'Microsoft.WindowsDesktop.App' -or
              -not (Test-Path -LiteralPath (Join-Path $outputA 'coreclr.dll')) -or
              -not (Test-Path -LiteralPath (Join-Path $outputA 'PresentationFramework.dll'))) {
            throw 'The portable package is missing its bundled runtime.'
          }
          $errorLog = Join-Path $env:RUNNER_TEMP 'FolderTwin-portable-smoke.err'
          $process = Start-Process -FilePath (Join-Path $outputA 'CopyLab.exe') -WorkingDirectory $outputA -ArgumentList '--smoke' -WindowStyle Hidden -RedirectStandardError $errorLog -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Get-Content -LiteralPath $errorLog
            throw "The packaged WPF smoke test exited with $($process.ExitCode)."
          }
          $productLog = Join-Path $env:RUNNER_TEMP 'FolderTwin-product-smoke.err'
          $product = Start-Process -FilePath (Join-Path $outputA 'CopyLab.exe') -WorkingDirectory $outputA -ArgumentList '--product-smoke' -WindowStyle Hidden -RedirectStandardError $productLog -PassThru -Wait
          Get-Content -LiteralPath $productLog
          if ($product.ExitCode -ne 0) { throw "The packaged product wizard exited with $($product.ExitCode)." }
          $scheduleLog = Join-Path $env:RUNNER_TEMP 'FolderTwin-schedule-smoke.err'
          $schedule = Start-Process -FilePath (Join-Path $outputA 'CopyLab.exe') -WorkingDirectory $outputA -ArgumentList '--schedule-smoke' -WindowStyle Hidden -RedirectStandardError $scheduleLog -PassThru
          $productScheduleLog = Join-Path $env:RUNNER_TEMP 'FolderTwin-product-schedule-smoke.err'
          $productSchedule = Start-Process -FilePath (Join-Path $outputA 'CopyLab.exe') -WorkingDirectory $outputA -ArgumentList '--product-schedule-smoke' -WindowStyle Hidden -RedirectStandardError $productScheduleLog -PassThru
          $schedule.WaitForExit()
          $productSchedule.WaitForExit()
          Get-Content -LiteralPath $scheduleLog
          Get-Content -LiteralPath $productScheduleLog
          if ($schedule.ExitCode -ne 0) {
            throw "The packaged Windows schedule test exited with $($schedule.ExitCode)."
          }
          if ($productSchedule.ExitCode -ne 0) { throw "The packaged product schedule test exited with $($productSchedule.ExitCode)." }
      - name: Upload the verified alpha
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FolderTwin-alpha-win-x64-${{ github.sha }}
          path: ${{ runner.temp }}/FolderTwin-alpha-win-x64
          if-no-files-found: error
          retention-days: 14
