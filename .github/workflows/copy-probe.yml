name: Copy probe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build entire FolderTwin solution
        run: dotnet build FolderTwin.sln --configuration Release
      - name: Verify synthetic copy and restore
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build
      - name: Compare Windows transports
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --compare
      - name: Compare buffered and unbuffered verification
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --uncached
      - name: Verify explicit append-only continuation of matching partial copies
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --prefix-resume
      - name: Verify directory rename and junction behavior
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --paths
      - name: Verify bounded Zone.Identifier metadata, shared objects and recovery
        shell: pwsh
        run: |
          foreach ($probe in @('--zone-native', '--zone-local')) {
            dotnet run --project tests/CopyProbe --configuration Release --no-build -- $probe
            if ($LASTEXITCODE -ne 0) { throw "Zone metadata acceptance failed: $probe" }
          }
      - name: Verify read-only inspection and reopening of product roots
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-roots
      - name: Verify durable product job registration
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-jobs
      - name: Verify reviewed portable configuration and restoration of imported jobs
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-config
      - name: Verify product versions, mirror, offline restoration and retention
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-store
      - name: Verify independent read-only recovery without the original profile
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-backup-recovery
      - name: Verify cumulative updates, destination conflicts and interrupted publication
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --accumulative
      - name: Verify persistent product workers, pause, cancellation and process termination
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-runs
      - name: Verify coalescing and native file change signals
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-watch
      - name: Verify unattended mirror retirement, recovery and mass change limits
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-auto-mirror
      - name: Verify recoverable partial points and offline resumption in all modes
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-auto-partial
      - name: Verify reviewed restoration workers, cancellation, interruption and route exclusion
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-restore
      - name: Verify durable controllable mirror analysis and bound approvals
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --product-mirror-review
      - name: Verify recoverable abandonment of incomplete version generations
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --version-abandon
      - name: Verify bounded metadata inventory and partial results
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --inventory
      - name: Verify synthetic batches, partial results, and retry
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --batch
      - name: Verify configurable disposable workspaces
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --workspace
      - name: Verify versioned snapshots and restoration from shared objects
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --versions
      - name: Verify replicated generation expectations and interrupted registry writes
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --registry
      - name: Verify recoverable registry checkpoints and process termination
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --registry-checkpoint
      - name: Verify retention, recoverable quarantine and deferred purge
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --retention
      - name: Verify protected mirror previews, interruptions and recovery
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --mirror
      - name: Measure retention across eight generations with an absent source
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --retention-scale
      - name: Verify persistent headless version jobs
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --jobs
      - name: Verify versioning above the initial catalog entry limit
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --version-scale 10240 32
      - name: Verify confirmed catalogs and independent restoration
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --catalog
      - name: Verify durable pending intent and worker termination recovery
        run: dotnet run --project tests/CopyProbe --configuration Release --no-build -- --resume
      - name: Audit semantic readers, differential contents, offline references and lock boundaries
        shell: pwsh
        run: |
          foreach ($audit in @('--reader-audit', '--differential-audit', '--recovery-audit', '--concurrency-audit', '--import-concurrency-audit')) {
            dotnet run --project tests/CopyProbe --configuration Release --no-build -- $audit
            if ($LASTEXITCODE -ne 0) { throw "Audit failed: $audit" }
          }
      - name: Build the portable app twice and verify the WPF and binary isolation suites
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'FolderTwin-source.tar'
          $sourceA = Join-Path $env:RUNNER_TEMP 'FolderTwin-source-A'
          $sourceB = Join-Path $env:RUNNER_TEMP 'FolderTwin-source-B'
          $outputA = Join-Path $env:RUNNER_TEMP 'FolderTwin-win-x64'
          $outputB = Join-Path $env:RUNNER_TEMP 'FolderTwin-reproduction'
          git archive --format=tar "--output=$archive" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the tested commit.' }
          foreach ($source in @($sourceA, $sourceB)) {
            New-Item -ItemType Directory -Path $source | Out-Null
            tar -xf $archive -C $source
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract a clean source tree.' }
          }
          $revision = git rev-parse HEAD
          & (Join-Path $sourceA 'scripts/Publish-Portable.ps1') -OutputDirectory $outputA -SourceArchive $archive -SourceRevision $revision
          & (Join-Path $sourceB 'scripts/Publish-Portable.ps1') -OutputDirectory $outputB -SourceArchive $archive -SourceRevision $revision
          $first = Get-FileHash -LiteralPath (Join-Path $outputA 'SHA256SUMS.txt')
          $second = Get-FileHash -LiteralPath (Join-Path $outputB 'SHA256SUMS.txt')
          if ($first.Hash -ne $second.Hash) {
            Compare-Object (Get-Content $first.Path) (Get-Content $second.Path)
            throw 'Independent builds produced different file hashes.'
          }
          Write-Host "Matching portable distributions. SHA256SUMS.txt SHA-256 $($first.Hash)"
          & (Join-Path $sourceA 'scripts/Test-Portable.ps1') -PackageDirectory $outputA -SourceRevision $revision
          $runtime = Get-Content -LiteralPath (Join-Path $outputA 'FolderTwin.runtimeconfig.json') -Raw | ConvertFrom-Json
          $frameworks = $runtime.runtimeOptions.includedFrameworks.name
          if ($frameworks -notcontains 'Microsoft.NETCore.App' -or $frameworks -notcontains 'Microsoft.WindowsDesktop.App' -or
              -not (Test-Path -LiteralPath (Join-Path $outputA 'coreclr.dll')) -or
              -not (Test-Path -LiteralPath (Join-Path $outputA 'PresentationFramework.dll'))) {
            throw 'The portable package is missing its bundled runtime.'
          }
          $auditArtifacts = Join-Path $env:RUNNER_TEMP 'FolderTwin-BinaryAudit'
          dotnet build tests/AutomationAcceptance -c Release --artifacts-path $auditArtifacts "-p:ReferenceCoreAssembly=$outputA/FolderTwin.Core.dll" --nologo
          if ($LASTEXITCODE -ne 0) { throw 'AutomationAcceptance failed to build against packaged FolderTwin.Core.dll.' }
          dotnet (Join-Path $auditArtifacts 'bin/AutomationAcceptance/release/AutomationAcceptance.dll') --packaged-binary-audit (Join-Path $outputA 'FolderTwin.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary isolation audit failed.' }
          ./tests/AutomationAcceptance/Test-IsolatedStartup.ps1 -PackageDirectory $outputA -SourceRevision $revision
          $uiTestOut = Join-Path $env:RUNNER_TEMP 'FolderTwin-UiTests'
          dotnet publish tests/CopyLab.Tests/CopyLab.Tests.csproj -c Release -r win-x64 --self-contained true "-p:RuntimeFrameworkVersion=10.0.15" --output $uiTestOut --nologo
          if ($LASTEXITCODE -ne 0) { throw 'CopyLab.Tests publish failed.' }
          $testExe = Join-Path $uiTestOut 'CopyLab.Tests.exe'
          $env:FOLDERTWIN_TEST_PACKAGE_DIR = $outputA
          foreach ($flag in @('--product-startup-smoke', '--smoke', '--product-smoke', '--index-audit', '--tray-audit', '--schedule-policy-audit', '--history-audit', '--product-monitor-smoke', '--product-monitor-schedule-smoke', '--product-monitor-reconciliation-smoke', '--product-automation-ui-smoke')) {
            $log = Join-Path $env:RUNNER_TEMP ("FolderTwin" + $flag + '.err')
            $proc = Start-Process -FilePath $testExe -WorkingDirectory $uiTestOut -ArgumentList $flag -WindowStyle Hidden -RedirectStandardError $log -PassThru -Wait
            Get-Content -LiteralPath $log
            if ($proc.ExitCode -ne 0) { throw "UI/Monitor test failed: $flag ($($proc.ExitCode))" }
          }
      - name: Upload the verified Windows package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FolderTwin-win-x64-${{ github.sha }}
          path: ${{ runner.temp }}/FolderTwin-win-x64
          if-no-files-found: error
          retention-days: 30
