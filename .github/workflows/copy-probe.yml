name: Copy probe

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify synthetic copy and restore
        run: dotnet run --project experiments/CopyProbe --configuration Release
      - name: Compare Windows transports
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --compare
      - name: Compare buffered and unbuffered verification
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --uncached
      - name: Verify directory rename and junction behavior
        run: dotnet run --project experiments/CopyProbe --configuration Release --no-build -- --paths
      - name: Verify the WPF copy and restore flow
        run: dotnet run --project experiments/CopyLab --configuration Release -- --smoke
