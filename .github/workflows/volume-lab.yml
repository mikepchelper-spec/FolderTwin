name: Disposable volume lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-volume:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build CopyProbe for volume lab
        run: dotnet publish tests/CopyProbe/CopyProbe.csproj -c Release -r win-x64 --self-contained true "-p:RuntimeFrameworkVersion=10.0.15" --output "$env:RUNNER_TEMP\FolderTwin-volume-probe"
      - name: Exercise disk full, reassignment, and reconnection
        run: ./tests/CopyProbe/Run-VolumeLab.ps1
