name: Disposable volume lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-volume:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build the self-contained portable package
        run: ./scripts/Publish-Alpha.ps1 -OutputDirectory "$env:RUNNER_TEMP\FolderTwin-volume-package"
      - name: Exercise disk full, reassignment, and reconnection
        run: ./experiments/CopyProbe/Run-VolumeLab.ps1
