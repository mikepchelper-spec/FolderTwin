name: Synthetic object layout

on:
  workflow_dispatch:
    inputs:
      count:
        description: Synthetic objects per layout
        type: choice
        default: '4096'
        options: ['4096', '329000', '1000000']

permissions:
  contents: read

jobs:
  index:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Import and browse 329000 indexed paths
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'FolderTwin-Index-Build'
          dotnet build experiments/CopyLab -c Release --output $build
          if ($LASTEXITCODE -ne 0) { throw 'The index scale probe did not build.' }
          $log = Join-Path $env:RUNNER_TEMP 'FolderTwin-Index.err'
          $process = Start-Process -FilePath (Join-Path $build 'CopyLab.exe') -ArgumentList '--index-scale' -WindowStyle Hidden -RedirectStandardError $log -PassThru -Wait
          Get-Content -LiteralPath $log
          if ($process.ExitCode -ne 0) { throw 'The index scale probe failed.' }
  layout:
    runs-on: windows-2025
    timeout-minutes: 50
    strategy:
      matrix:
        level: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build the layout probe
        shell: pwsh
        run: |
          dotnet build experiments/CopyProbe -c Release --output "$env:RUNNER_TEMP\FolderTwin-Layout-Build"
          if ($LASTEXITCODE -ne 0) { throw 'The layout probe did not build.' }
      - name: Measure a layout on a dedicated disposable NTFS image
        shell: pwsh
        env:
          OBJECT_COUNT: ${{ inputs.count }}
          LAYOUT_LEVEL: ${{ matrix.level }}
        run: |
          ./experiments/CopyProbe/Run-ObjectLayout.ps1 -Count $env:OBJECT_COUNT -Levels $env:LAYOUT_LEVEL
