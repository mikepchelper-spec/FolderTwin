{
  "name": "Verificación o recuperación",
  "description": "Hash inesperado, punto pendiente o dificultad al verificar, recuperar o conservar un respaldo.",
  "title": "[Recuperación] ",
  "labels": [
    "bug"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Vista previa experimental: solo datos sintéticos y carpetas desechables. No adjuntes respaldos, catálogos, credenciales, configuraciones exportadas, logs completos, rutas personales ni capturas privadas. Para vulnerabilidades usa [el canal privado](https://github.com/mikepchelper-spec/FolderTwin/security/advisories/new)."
      }
    },
    {
      "type": "markdown",
      "attributes": {
        "value": "Ante contenido inesperado, detén nuevas ejecuciones y conserva el estado. No purgues, no borres diarios y no sobrescribas el origen para completar el formulario. No se ofrece un servicio de recuperación de datos personales."
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Versión o commit del paquete",
        "description": "Consulta COMPILACION.json o la entrega descargada. No pegues el archivo completo.",
        "placeholder": "v1.0.0-rc.1 / e4e87b8"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Entorno general",
        "description": "Edición/compilación de Windows y tipo de volumen. Sin nombre de equipo, números de serie ni rutas.",
        "placeholder": "Windows 11 x64, compilación ..., NTFS local"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "mode",
      "attributes": {
        "label": "Modo",
        "description": "Selecciona el modo afectado.",
        "options": [
          "Copia acumulativa",
          "Versionado",
          "Espejo protegido",
          "Aplicación o no aplica"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "operation",
      "attributes": {
        "label": "Acción afectada",
        "description": "Identifica el paso sin subir archivos del respaldo.",
        "options": [
          "Verificar respaldo",
          "Recuperar punto o archivo",
          "Reanudar una operación",
          "Retención o cuarentena",
          "Otra acción"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "observed",
      "attributes": {
        "label": "Estado y resultado observado",
        "description": "Resume el aviso, lo esperado y lo observado. Si ya comprobaste un punto previo, indica el resultado; si no, escribe no comprobado. Sin rutas ni identificadores privados."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reproduction",
      "attributes": {
        "label": "Secuencia sintética disponible",
        "description": "Describe cambios, interrupciones y acciones con nombres inventados. Si no hay reproducción sintética, indícalo y no continúes sobre datos personales."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Revisión antes de enviar",
        "options": [
          {
            "label": "Revisé el texto y no contiene archivos personales, credenciales, rutas absolutas ni logs completos.",
            "required": true
          },
          {
            "label": "La reproducción descrita usa datos sintéticos, o indiqué que todavía no tengo una reproducción sintética.",
            "required": true
          }
        ]
      }
    }
  ]
}
